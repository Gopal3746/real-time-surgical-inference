[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "surgphase"
version = "0.1.0"
description = "Real-time surgical video inference pipeline using MONAI, TensorRT, and Triton"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
    "torch>=2.8",
    "torchvision>=0.23",
    "monai>=1.6,<2",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

triton = [
    "tritonclient[http]>=2.72,<3",
]

onnx = [
    "onnx>=1.18",
    "onnxscript>=0.3",
    "onnxruntime>=1.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"